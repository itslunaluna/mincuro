<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ROC'U creates contemporary objects and homeware from natural stone." />
    
    <title>ROC'U | Natural Stone Objects & Homeware</title>
    
    <!-- Open Graph -->
    <meta property="og:title" content="ROC'U — Natural Stone Objects & Homeware" />
    <meta property="og:description" content="ROC'U creates contemporary objects and homeware from natural stone." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#374027" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    
    <!-- Styles -->
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
    <!-- Main Content -->
    <main>
        <!-- Hero Section -->
        <section class="hero">
            <div class="container">
                <div class="hero-visual">
                    <img 
                        src="assets/logo.PNG" 
                        alt="ROC'U natural stone objects and homeware collection" 
                        loading="lazy"
                    />
                </div>
                <!-- <div class="hero-content">
                    <p class="hero-subtitle">Natural stone objects &amp; homeware</p>
                </div> -->
            </div>
        </section>

        <!-- Brand Intro -->
        <section class="brand-intro">
            <div class="container">
                <p class="tagline">Contemporary objects shaped from natural stone.</p>
                <p class="description">
                    ROC'U brings the timeless beauty of natural stone into modern living spaces. 
                    Each piece is thoughtfully designed and crafted, celebrating the unique character 
                    of marble and stone.
                </p>
            </div>
        </section>

        <!-- Shop Links -->
        <section class="shop-links">
            <div class="container">
                <p class="section-label">Shop ROC'U</p>
                <div class="shop-links-grid" id="shopLinks">
                </div>
            </div>
        </section>

        <!-- Social Links -->
        <section class="social-links">
            <div class="container">
                <p class="section-label">Follow ROC'U</p>
                <div class="social-links-grid" id="socialLinks">
                </div>
            </div>
        </section>

        <!-- Contact -->
        <section class="contact">
            <div class="container">
                <h2 class="contact-title">Get in touch</h2>
                <p class="contact-email" id="contactEmail">
                </p>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p class="footer-copyright">
                &copy; <span id="currentYear"></span> ROC'U. All rights reserved.
            </p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/links.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
